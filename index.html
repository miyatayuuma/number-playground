function candidates(){if(prime(n))return shuffle(P.filter(x=>x!==n)).slice(0,4).map(v=>[v,0]).concat([['PRIME',1]]);let v=divs(n),c=[v[Math.random()*v.length|0]];if(v.length>1&&Math.random()<.45)c.push(v.find(x=>x!==c[0]));let r=shuffle(P.filter(x=>!c.includes(x)));while(c.length<4)c.push(r.shift());return shuffle(c).map(v=>[v,0]).concat([['PRIME',1]])}function cards(){D.innerHTML='';for(let[v,p]of candidates()){let c=document.createElement('div');c.className='card'+(p?' prime':'');c.dataset.v=v;c.dataset.p=p;c.innerHTML=p?'<small>FINAL</small><div class="val">PRIME</div>':`<small>BREAK</small><div class="mini">${'<i></i>'.repeat(Math.min(13,v))}</div><div class="val">${v}</div>`;c.onpointerdown=dragStart;D.appendChild(c)}}function hud(){$('#stage').textContent=stage;$('#score').textContent=score;$('#miss').textContent='MISS '+miss;$('#num').textContent=n;rageFx()}
function sparks(k=14){let r=E.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;for(let i=0;i<k;i++){let e=document.createElement('i'),a=Math.random()*6.28,d=25+Math.random()*70;e.className='particle';e.style.left=x+'px';e.style.top=y+'px';e.style.color=color(i,k);document.body.appendChild(e);e.animate([{transform:'translate(-50%,-50%)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:400+Math.random()*300});setTimeout(()=>e.remove(),750)}}function hitText(x){let r=E.getBoundingClientRect(),e=document.createElement('div');e.className='hittext';e.textContent=x;e.style.left=r.left+r.width*.55+'px';e.style.top=r.top+r.height*.3+'px';document.body.appendChild(e);e.animate([{transform:'translate(-50%,0)',opacity:0},{transform:'translate(-50%,-18px) scale(1.1)',opacity:1,offset:.3},{transform:'translate(-50%,-55px)',opacity:0}],{duration:900});setTimeout(()=>e.remove(),950)}
async function fire(f){let rows=n/f,ammo=n-rows,tr=E.getBoundingClientRect(),tx=tr.left+tr.width/2,ty=tr.top+tr.height*.55,q=[];msg('CORE SHOT READY!',`${ammo} DOTS を こうげきに へんかん`,'gold');for(let r=0;r<rows;r++){let keep=r*f;dots[keep].el.classList.add('keep');for(let c=1;c<f;c++){let d=dots[keep+c],sr=d.el.getBoundingClientRect(),sx=sr.left+6.5,sy=sr.top+6.5,e=document.createElement('i');e.className='shot';e.style.left=sx-4.5+'px';e.style.top=sy-4.5+'px';e.style.color=d.el.style.color;document.body.appendChild(e);d.el.style.opacity=.07;let dx=tx-sx+(Math.random()-.5)*16,dy=ty-sy+(Math.random()-.5)*14,side=(c-(f-1)/2)*8,dl=c*45+r*7,an=e.animate([{transform:'translate(0,0) scale(.7)',opacity:.8},{transform:`translate(${dx*.5+side}px,${dy*.5}px) scale(1.35)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.2)`,opacity:0}],{duration:520+Math.random()*160,delay:dl,easing:'cubic-bezier(.2,.75,.25,1)',fill:'forwards'});q.push(an.finished.catch(()=>{}).then(()=>e.remove()))}}await sleep(350);msg('FIRE!',`CORE SHOT ×${ammo}`,'gold');await sleep(320);react('hit');shake('impact');flash('g');sparks(Math.min(22,8+(ammo/4|0)));hitText(`HIT ×${ammo}`);breakShield();await Promise.all(q);return rows}
async function counter(){msg(rage>=3?'BERSERK!':'ENEMY STRIKE!',`RAGE ${rage} / ${maxR}`,'bad');react('attack');let er=E.getBoundingClientRect(),ar=A.getBoundingClientRect(),sx=er.left+er.width/2,sy=er.top+er.height*.7,tx=ar.left+ar.width/2,ty=ar.top+ar.height*.42,e=document.createElement('i');e.className='eshot';e.style.left=sx-12+'px';e.style.top=sy-12+'px';document.body.appendChild(e);await e.animate([{transform:'translate(0,0) scale(.5)',opacity:.4},{transform:`translate(${(tx-sx)*.5}px,${(ty-sy)*.5}px) scale(1.2)`,opacity:1,offset:.55},{transform:`translate(${tx-sx}px,${ty-sy}px) scale(1.8)`,opacity:0}],{duration:620,easing:'cubic-bezier(.3,.7,.3,1)'}).finished.catch(()=>{});e.remove();shake('counter');flash('r');await sleep(300)}async function rageUp(){setR(rage+1);let t=['','RAGE UP!','DANGER!','BERSERK!','RAGE MAX!'][rage];msg(t,rage===4?'CORE が のみこまれる！':'てきが きょうかした！','bad');await sleep(700);await counter();if(rage===maxR){done=1;busy=1;D.innerHTML='';msg('CORE OVERRUN!','RAGE MAX','bad');$('#loseCore').textContent=`CORE ${n}`;await sleep(600);$('#lose').classList.add('show');return 0}return 1}
async function good(f){let rows=await fire(f);msg('CORE BREAK!',`${n} → ${rows}`,'gold');await sleep(700);factors.push(f);score+=20;n=rows;hud();makeDots();cards();A.classList.remove('ok');busy=0;msg(prime(n)?'PRIME CORE?':'NEXT CORE!',prime(n)?`CORE ${n} を みきわめろ`:`CORE ${n} の CODE を さがせ`,prime(n)?'gold':'')}
async function tryFactor(f){if(busy||done)return;busy=1;D.innerHTML='';await arrange(f);let r=n%f;if(!r){A.classList.add('ok');msg('SYNC LOCKED!','PERFECT FORM!','good',1);flash('g');await wait();await good(f);return}let m=f-r;score=Math.max(0,score-10);miss++;hud();A.classList.add('fail');flash('r');if(r<=m){for(let i=n-r;i<n;i++)dots[i].el.classList.add('out');msg('SYNC LOST!',`${r} DOT${r===1?'':'S'} OUT!`,'bad',1)}else{missing(f);msg('SYNC LOST!',`あと ${m}こ!`,'bad',1)}await wait(4800);if(await rageUp())scatter()}
function orbit(){let ar=A.getBoundingClientRect(),o=document.createElement('div'),s=document.createElement('div'),cx=ar.left+ar.width/2,cy=ar.top+ar.height/2;o.className='orb';o.style.left=cx+'px';o.style.top=cy+'px';s.className='spin';for(let i=0;i<n;i++){let d=document.createElement('i'),a=-Math.PI/2+i*6.283/n;d.className='odot';d.style.color=color(i,n);d.style.transform=`translate(${Math.cos(a)*35}px,${Math.sin(a)*35}px)`;s.appendChild(d)}let c=document.createElement('i');c.className='ocore';s.appendChild(c);o.appendChild(s);document.body.appendChild(o);return o}function boom(){let r=E.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;for(let i=0;i<34;i++){let p=document.createElement('i'),a=Math.random()*6.28,d=70+Math.random()*160;p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.color=color(i,34);document.body.appendChild(p);p.animate([{transform:'translate(-50%,-50%)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.4)`,opacity:0}],{duration:700+Math.random()*650});setTimeout(()=>p.remove(),1400)}}async function primeStrike(o){o.querySelector('.spin').classList.add('fast');msg('FINAL BREAK!','PRIME CORE GO!','gold');await sleep(380);let er=E.getBoundingClientRect(),or=o.getBoundingClientRect(),sx=or.left+46,sy=or.top+46,tx=er.left+er.width/2,ty=er.top+er.height*.55,dx=tx-sx,dy=ty-sy;await o.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:`translate(calc(-50% + ${dx*.55}px),calc(-50% + ${dy*.55}px)) scale(1.2)`,filter:'brightness(2)',offset:.72},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.4)`,filter:'brightness(4)'}],{duration:560,easing:'cubic-bezier(.35,.05,.25,1)',fill:'forwards'}).finished.catch(()=>{});o.remove();shake('counter');flash('g');sparks(30);boom();E.classList.add('dead');document.querySelectorAll('.shield').forEach(x=>x.classList.add('break'));await sleep(950)}async function tryPrime(){if(busy||done)return;if(!prime(n)){score=Math.max(0,score-15);miss++;hud();A.classList.add('fail');msg('CORE LOCKED!','まだ BREAK CODE が ある！','bad',1);busy=1;D.innerHTML='';await wait(4400);if(await rageUp())scatter();return}busy=1;D.innerHTML='';msg('PRIME CORE!','CIRCLE FORM','gold');let{w,h}=size(),cx=w/2-6.5,cy=h/2-6.5,rr=Math.min(w,h)*.34;dots.forEach((d,i)=>pos(d,cx+Math.cos(-Math.PI/2+i*6.283/n)*rr,cy+Math.sin(-Math.PI/2+i*6.283/n)*rr,1));await sleep(1000);let o=orbit();dots.forEach(d=>d.el.style.opacity=.04);msg('SPIN UP!','PRIME CORE CHARGING...','gold');await sleep(1150);o.querySelector('.spin').classList.add('fast');msg('PRIME CORE READY!','タップで FINAL BREAK','gold',1);await wait(5200);done=1;score+=30;if(!rage)score+=50;hud();await primeStrike(o);$('#code').textContent=`${startN} = ${[...factors,n].join(' × ')}`;$('#win').classList.add('show')}
function dragStart(e){if(busy||done)return;e.preventDefault();let c=e.currentTarget,p=c.dataset.p==='1',v=c.dataset.v,g=document.createElement('div');g.className='ghost'+(p?' prime':'');g.textContent=p?'PRIME':v;document.body.appendChild(g);c.classList.add('drag');drag={c,p,v,g};dragMove(e);window.onpointermove=dragMove;window.onpointerup=dragEnd}function dragMove(e){if(!drag)return;drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';let r=A.getBoundingClientRect(),inr=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;A.classList.toggle('ready',inr)}function dragEnd(e){if(!drag)return;window.onpointermove=null;window.onpointerup=null;let r=A.getBoundingClientRect(),inr=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom,d=drag;d.c.classList.remove('drag');d.g.remove();A.classList.remove('ready');drag=null;if(!inr)return;d.p?tryPrime():tryFactor(+d.v)}
function start(number=null,same=0){startN=number||newN();n=startN;factors=[];rage=0;done=busy=0;if(!same)pickEnemy();else E.className='enemy',E.textContent=enemy,rageFx();resetShield();$('#win').classList.remove('show');$('#lose').classList.remove('show');A.classList.remove('fail','ok','ready');hud();makeDots();cards();msg('ENEMY CORE DETECTED!',`CORE ${n} の BREAK CODE を さがせ`)}$('#next').onclick=()=>{stage++;start()};$('#retry').onclick=()=>start(startN,1);window.onresize=()=>{if(busy)return;let s=size();dots.forEach(d=>pos(d,Math.min(d.x,s.w-20),Math.min(d.y,s.h-20)))};start();requestAnimationFrame(move);
</script></body></html>
