<title>CORE BREAK</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f9ff;background:#080b12;--bg:#080b12;--panel:#111825;--panel2:#182235;--line:#2b3951;--muted:#8997ad;--cyan:#6ee7ff;--violet:#b6a1ff;--gold:#ffd75f;--good:#74f5a4;--bad:#ff777f;--white:#f7f9ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#1d3152 0,transparent 38%),radial-gradient(circle at 15% 45%,#151d31 0,transparent 30%),var(--bg);color:var(--white)}body{overflow-x:hidden}button{font:inherit}.app{width:min(100%,760px);margin:0 auto;padding:12px 12px 44px}.hud{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 2px 10px}.brand{font-size:clamp(25px,7vw,40px);font-weight:1000;letter-spacing:.04em;line-height:1}.tag{margin-top:5px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em}.stats{display:flex;gap:8px}.stat{min-width:70px;padding:7px 10px;border:1px solid #27344a;border-radius:14px;background:#0e1420cc;text-align:center}.stat small{display:block;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.12em}.stat b{display:block;margin-top:2px;font-size:20px;line-height:1;color:var(--gold)}.battle{position:relative;border:1px solid #25324a;border-radius:28px;background:linear-gradient(180deg,#111a2b,#0d131f);box-shadow:0 22px 70px #0007;overflow:hidden}.enemy-zone{position:relative;height:176px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 58%,#263c65 0,#151e32 36%,#0d131f 72%)}.enemy-aura{position:absolute;width:146px;height:146px;border-radius:50%;border:1px solid #6ee7ff2e;box-shadow:0 0 50px #6ee7ff1a,inset 0 0 35px #6ee7ff12;animation:spin 9s linear infinite}.enemy-aura::before,.enemy-aura::after{content:"";position:absolute;border-radius:50%;inset:12px;border:1px dashed #b6a1ff32}.enemy-aura::after{inset:29px;border-color:#ffd75f24;animation:spinBack 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinBack{to{transform:rotate(-360deg)}}.enemy{position:relative;z-index:2;font-size:94px;line-height:1;filter:drop-shadow(0 14px 14px #0008);transform-origin:50% 70%;animation:float 2.8s ease-in-out infinite;user-select:none}.enemy-mark{position:absolute;z-index:3;right:calc(50% - 67px);top:24px;font-size:28px;filter:drop-shadow(0 3px 6px #0008)}@keyframes float{0%,100%{transform:translateY(3px) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}.enemy.hit{animation:enemyHit .58s ease}@keyframes enemyHit{0%{transform:translateY(0) scale(1)}28%{transform:translateY(-2px) translateX(16px) rotate(8deg) scale(.93);filter:brightness(2)}60%{transform:translateX(-7px) rotate(-4deg)}100%{transform:none}}.enemy.attack{animation:enemyAttack .62s ease}@keyframes enemyAttack{0%{transform:none}45%{transform:translateY(16px) scale(1.22);filter:brightness(1.35)}100%{transform:none}}.enemy.defeated{animation:enemyGone .95s cubic-bezier(.2,.8,.2,1) forwards}@keyframes enemyGone{0%{transform:scale(1);opacity:1;filter:brightness(1)}45%{transform:scale(1.28) rotate(-8deg);filter:brightness(3)}100%{transform:scale(.08) rotate(35deg);opacity:0;filter:brightness(5)}}.shields{position:absolute;inset:0;pointer-events:none}.shield{position:absolute;left:50%;top:52%;width:128px;height:128px;border-radius:50%;border:2px solid #79eaff55;transform:translate(-50%,-50%) rotate(var(--rot));box-shadow:0 0 18px #6ee7ff1a;transition:opacity .3s,transform .45s,filter .35s}.shield::before{content:"";position:absolute;left:10%;top:-3px;width:27px;height:5px;border-radius:999px;background:#a7efff;box-shadow:0 0 12px #6ee7ff}.shield:nth-child(2){width:147px;height:147px;border-color:#b6a1ff44}.shield:nth-child(3){width:165px;height:165px;border-color:#ffd75f38}.shield.break{opacity:0;filter:brightness(3);transform:translate(-50%,-50%) rotate(calc(var(--rot) + 55deg)) scale(1.32)}.core-badge{position:absolute;z-index:5;left:50%;bottom:6px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 15px;border:1px solid #60799c;border-radius:999px;background:#090e16e8;box-shadow:0 0 30px #6ee7ff23}.core-badge small{color:#9daec4;font-size:10px;font-weight:950;letter-spacing:.12em}.core-number{font-size:30px;font-weight:1000;line-height:1;color:#fff;text-shadow:0 0 14px #6ee7ff88}.status{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-top:1px solid #25324a;border-bottom:1px solid #25324a;background:#0c121c;transition:background .2s,border-color .2s,box-shadow .2s}.status.good{background:#0d1d17;border-color:#2d6d47;box-shadow:inset 0 0 32px #74f5a40d}.status.bad{background:#210e13;border-color:#6e3239;box-shadow:inset 0 0 32px #ff777f0e}.status.gold{background:#201b0d;border-color:#716026;box-shadow:inset 0 0 32px #ffd75f0d}.status-main{font-size:clamp(20px,5.7vw,31px);font-weight:1000;letter-spacing:.025em}.status-sub{margin-top:3px;color:#c7d0dd;font-size:12px;font-weight:850}.tap-next{display:none;color:#a8b3c3;font-size:10px;font-weight:950;white-space:nowrap;animation:pulse 1s ease-in-out infinite}.status.can-advance .tap-next{display:block}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.arena{position:relative;height:322px;overflow:hidden;touch-action:none;background:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px),radial-gradient(circle at 50% 45%,#18253a 0,#0c121c 65%);background-size:32px 32px,32px 32px,auto;border-bottom:1px solid #25324a;transition:filter .25s,box-shadow .25s}.arena.dropready{box-shadow:inset 0 0 0 3px #ffd75f66,inset 0 0 55px #ffd75f16}.arena.success{box-shadow:inset 0 0 0 3px #74f5a488,inset 0 0 70px #74f5a421}.arena.fail{filter:brightness(.66) saturate(.72);box-shadow:inset 0 0 0 3px #ff777f66,inset 0 0 70px #000b}.p-dot{position:absolute;left:0;top:0;width:13px;height:13px;border-radius:50%;will-change:transform;box-shadow:0 0 10px currentColor}.p-dot.placed{box-shadow:0 0 14px currentColor}.p-dot.outlier{box-shadow:0 0 0 3px #fff,0 0 24px #ff656d;filter:brightness(1.5)}.p-dot.core-dot{box-shadow:0 0 0 4px #fff4,0 0 28px currentColor;filter:brightness(1.7)}.empty-slot{position:absolute;width:13px;height:13px;border-radius:50%;border:2px dashed #ff777f;box-shadow:0 0 18px #ff777f99;animation:slot .62s ease-in-out infinite}@keyframes slot{0%,100%{opacity:.25;transform:scale(.82)}50%{opacity:1;transform:scale(1.25)}}.drop-hint{position:absolute;inset:auto 0 9px;text-align:center;color:#5f6d82;font-size:10px;font-weight:950;letter-spacing:.12em;pointer-events:none}.arena.dropready .drop-hint{color:#ffe481}.dock-wrap{padding:12px 11px 14px;background:#0e141f}.dock-title{display:flex;justify-content:space-between;gap:10px;margin:0 2px 8px;color:#8794a8;font-size:11px;font-weight:900}.dock{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.factor-card{min-height:82px;border:1px solid #33415a;border-radius:16px;background:linear-gradient(180deg,#1e2a3e,#151d2b);color:#fff;text-align:center;padding:6px 3px;user-select:none;touch-action:none;cursor:grab;box-shadow:0 8px 18px #0004;transition:opacity .15s,transform .15s,border-color .15s}.factor-card.dragging{opacity:.3;transform:scale(.95)}.factor-card small{display:block;color:#8492a7;font-size:8px;font-weight:950;letter-spacing:.11em}.factor-value{font-size:28px;font-weight:1000;line-height:1.05;margin-top:3px}.mini-dots{display:flex;justify-content:center;align-items:center;gap:3px;flex-wrap:wrap;width:38px;min-height:20px;margin:3px auto}.mini-dot{width:5px;height:5px;border-radius:50%;background:#6ee7ff}.factor-card.prime{border-color:#756328;background:linear-gradient(180deg,#3a3018,#211c10)}.factor-card.prime .factor-value{font-size:15px;color:#ffe481;margin-top:18px}.drag-ghost{position:fixed;z-index:9999;width:72px;height:72px;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff55;border-radius:18px;background:#223047f2;color:#fff;font-size:26px;font-weight:1000;box-shadow:0 18px 42px #000a;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg)}.drag-ghost.prime{background:#3a3018f2;color:#ffe481}.flash{position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:0;background:#fff}.flash.good.go{animation:flashGood .5s ease}.flash.bad.go{animation:flashBad .45s ease}@keyframes flashGood{0%{opacity:0}25%{opacity:.2;background:#a7ffc3}100%{opacity:0}}@keyframes flashBad{0%{opacity:0}25%{opacity:.18;background:#ff5964}100%{opacity:0}}.particle{position:fixed;z-index:9500;width:9px;height:9px;border-radius:50%;pointer-events:none;background:var(--gold);box-shadow:0 0 12px currentColor}.result-layer{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:18px;background:#05070bc9;backdrop-filter:blur(8px)}.result-layer.show{display:flex}.result-card{width:min(92vw,500px);padding:24px 18px;border:1px solid #5a6580;border-radius:26px;background:linear-gradient(180deg,#182237,#0e1420);box-shadow:0 28px 90px #000d;text-align:center}.result-enemy{font-size:62px;filter:grayscale(.35);opacity:.65}.result-title{margin-top:4px;color:var(--gold);font-size:clamp(27px,8vw,40px);font-weight:1000;letter-spacing:.03em}.result-sub{margin-top:7px;color:#aab6c8;font-size:12px;font-weight:850}.code{margin:14px 0 18px;padding:13px;border:1px solid #35445f;border-radius:17px;background:#0b111b;font-size:clamp(20px,6vw,31px);font-weight:1000}.next{min-width:210px;border:0;border-radius:999px;padding:15px 23px;background:#f7f9ff;color:#0b0e14;font-size:17px;font-weight:1000;cursor:pointer}@media(max-width:540px){.app{padding:8px 8px 30px}.battle{border-radius:22px}.enemy-zone{height:160px}.enemy{font-size:82px}.arena{height:300px}.dock{gap:5px}.factor-card{min-height:76px;border-radius:14px}.factor-value{font-size:24px}.factor-card.prime .factor-value{font-size:13px}.status{padding:10px 11px}.stat{min-width:62px;padding:6px 8px}}
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<main class="app">
<header class="hud"><div><div class="brand">CORE BREAK</div><div class="tag">FIND THE BREAK CODE</div></div><div class="stats"><div class="stat"><small>STAGE</small><b id="stage">1</b></div><div class="stat"><small>SCORE</small><b id="score">0</b></div></div></header>
<section class="battle">
<div class="enemy-zone" id="enemyZone"><div class="enemy-aura"></div><div class="shields" id="shields"><i class="shield" style="--rot:14deg"></i><i class="shield" style="--rot:133deg"></i><i class="shield" style="--rot:251deg"></i></div><div class="enemy" id="enemy">🐲</div><div class="enemy-mark" id="enemyMark">🔥</div><div class="core-badge"><small>ENEMY CORE</small><div class="core-number" id="coreNumber">60</div></div></div>
<div class="status" id="status"><div><div class="status-main" id="statusMain">BREAK CARD を えらぼう</div><div class="status-sub" id="statusSub">カードを CORE へ ドラッグ</div></div><div class="tap-next">タップで すすむ</div></div>
<div class="arena" id="arena"><div class="drop-hint">DROP BREAK CARD HERE</div></div>
<div class="dock-wrap"><div class="dock-title"><span>BREAK CARDS</span><span id="miss">MISS 0</span></div><div class="dock" id="dock"></div></div>
</section>
</main>
<div class="result-layer" id="resultLayer"><div class="result-card"><div class="result-enemy" id="resultEnemy">🐲</div><div class="result-title">CORE DESTROYED!</div><div class="result-sub">CORE CODE COMPLETE</div><div class="code" id="coreCode">60 = 2 × 2 × 3 × 5</div><button class="next" id="nextEnemy">NEXT ENEMY</button></div></div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const primePool=[2,3,5,7,11,13],enemies=['🐲','👹','👾','🤖','👻','🐙','🦂','🐍','🦖','🦇','🐺','🐗'],marks=['🔥','⚡','❄️','🌪️','☄️','🌙','💥','🌀'];
const arena=$('#arena'),dock=$('#dock'),status=$('#status'),enemy=$('#enemy'),flash=$('#flash');
let stage=1,score=0,misses=0,stageMisses=0,initialNumber=60,currentNumber=60,factors=[],dots=[],busy=false,complete=false,animId=0,lastFrame=0,drag=null,emptySlots=[],shieldIndex=0,advanceResolver=null,advanceTimer=0,currentEnemy='🐲';
function isPrime(n){if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true}
function omega(n){let x=n,c=0;for(let p=2;p*p<=x;p++)while(x%p===0){x/=p;c++}if(x>1)c++;return c}
function validStart(n){return n>=18&&n<=120&&!isPrime(n)&&omega(n)>=3&&omega(n)<=5}
function makeStageNumber(){const pool=[];for(let n=18;n<=120;n++)if(validStart(n))pool.push(n);let n=pool[Math.floor(Math.random()*pool.length)];if(n===initialNumber&&pool.length>1)n=pool[(pool.indexOf(n)+1+Math.floor(Math.random()*(pool.length-1)))%pool.length];return n}
function primeDivisors(n){return primePool.filter(p=>n%p===0)}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickEnemy(){let e=enemies[Math.floor(Math.random()*enemies.length)];if(e===currentEnemy&&enemies.length>1)e=enemies[(enemies.indexOf(e)+1+Math.floor(Math.random()*(enemies.length-1)))%enemies.length];currentEnemy=e;enemy.textContent=e;$('#resultEnemy').textContent=e;$('#enemyMark').textContent=marks[Math.floor(Math.random()*marks.length)];enemy.className='enemy'}
function resetShields(){shieldIndex=0;document.querySelectorAll('.shield').forEach(s=>s.classList.remove('break'))}function breakShield(){const s=[...document.querySelectorAll('.shield')];if(shieldIndex<s.length){s[shieldIndex].classList.add('break');shieldIndex++}}
function enemyReact(kind){enemy.classList.remove('hit','attack');void enemy.offsetWidth;enemy.classList.add(kind);setTimeout(()=>enemy.classList.remove(kind),700)}function screenFlash(kind){flash.className='flash '+kind;void flash.offsetWidth;flash.classList.add('go');setTimeout(()=>flash.className='flash',600)}
function arenaSize(){const r=arena.getBoundingClientRect();return{w:r.width||600,h:r.height||310}}function randomPoint(){const{w,h}=arenaSize(),p=18;return[p+Math.random()*Math.max(1,w-p*2-13),p+Math.random()*Math.max(1,h-p*2-13)]}function dotColor(i,n){const t=n<=1?0:i/(n-1),h=195+150*t;return`hsl(${h} 90% 68%)`}
function setDot(d,x,y,t=false){d.x=x;d.y=y;d.el.style.transition=t?'transform .46s cubic-bezier(.2,.8,.2,1),opacity .42s,filter .3s':'none';d.el.style.transform=`translate3d(${x}px,${y}px,0)`}function clearDots(){dots.forEach(d=>d.el.remove());dots=[]}function clearSlots(){emptySlots.forEach(x=>x.remove());emptySlots=[]}
function createDots(n=currentNumber){clearDots();clearSlots();for(let i=0;i<n;i++){const el=document.createElement('i');el.className='p-dot';const c=dotColor(i,n);el.style.background=c;el.style.color=c;const[x,y]=randomPoint(),a=Math.random()*Math.PI*2,s=.03+Math.random()*.045,d={el,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,phase:Math.random()*6.28};setDot(d,x,y);arena.appendChild(el);dots.push(d)}}
function animate(ts){const dt=Math.min(34,ts-(lastFrame||ts));lastFrame=ts;if(!busy&&!complete){const{w,h}=arenaSize();for(const d of dots){d.phase+=dt*.0012;d.vx+=Math.cos(d.phase)*.0007;d.vy+=Math.sin(d.phase*1.19)*.0007;const sp=Math.hypot(d.vx,d.vy)||1,max=.085;if(sp>max){d.vx=d.vx/sp*max;d.vy=d.vy/sp*max}d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.x<7){d.x=7;d.vx=Math.abs(d.vx)}if(d.x>w-20){d.x=w-20;d.vx=-Math.abs(d.vx)}if(d.y<7){d.y=7;d.vy=Math.abs(d.vy)}if(d.y>h-20){d.y=h-20;d.vy=-Math.abs(d.vy)}d.el.style.transform=`translate3d(${d.x}px,${d.y}px,0)`}}animId=requestAnimationFrame(animate)}
function gridData(columns,n=currentNumber){const{w,h}=arenaSize(),rows=Math.ceil(n/columns),pad=31,gap=Math.min(27,(w-pad*2)/Math.max(1,columns-1),(h-pad*2)/Math.max(1,rows-1)),spanX=gap*(columns-1),spanY=gap*(rows-1),ox=(w-spanX)/2-6.5,oy=(h-spanY)/2-6.5,pts=[];for(let i=0;i<n;i++){const row=Math.floor(i/columns),col=i%columns;pts.push([ox+col*gap,oy+row*gap,row,col])}return{pts,gap,ox,oy,rows}}
function missingPositions(columns){const rem=currentNumber%columns;if(!rem)return[];const g=gridData(columns),row=g.rows-1,out=[];for(let c=rem;c<columns;c++)out.push([g.ox+c*g.gap-6.5,g.oy+row*g.gap-6.5]);return out}
function circlePositions(n=currentNumber){const{w,h}=arenaSize(),cx=w/2-6.5,cy=h/2-6.5,r=Math.min(w,h)*.34,out=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;out.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return out}
function setStatus(main,sub,tone='',advance=false){$('#statusMain').textContent=main;$('#statusSub').textContent=sub;status.className='status'+(tone?' '+tone:'')+(advance?' can-advance':'')}
function waitAdvance(ms=4300){return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(advanceTimer);advanceResolver=null;status.classList.remove('can-advance');resolve()};advanceResolver=finish;status.classList.add('can-advance');advanceTimer=setTimeout(finish,ms)})}function requestAdvance(){if(advanceResolver)advanceResolver()}status.addEventListener('pointerup',requestAdvance);arena.addEventListener('pointerup',()=>{if(advanceResolver)requestAdvance()});
function arrangementDelay(i,n){const left=n-i-1;if(left<3)return 360;if(left<7)return 220;if(i/n>.65)return 130;return 78}
async function arrangeSequential(factor){clearSlots();dots.forEach(d=>d.el.classList.remove('outlier','core-dot','placed'));const{pts}=gridData(factor);setStatus(`${factor}-LINE SCAN`,`${factor}れつに SYNC できるかな？`);await sleep(620);for(let i=0;i<dots.length;i++){const d=dots[i],p=pts[i];d.el.classList.add('placed');setDot(d,p[0],p[1],true);d.el.animate([{filter:'brightness(1)'},{filter:'brightness(1.9)'},{filter:'brightness(1)'}],{duration:320,easing:'ease-out'});await sleep(arrangementDelay(i,dots.length))}await sleep(650);return pts}
function showMissing(factor){clearSlots();for(const[x,y]of missingPositions(factor)){const el=document.createElement('i');el.className='empty-slot';el.style.left=x+'px';el.style.top=y+'px';arena.appendChild(el);emptySlots.push(el)}}
function scatter(){clearSlots();dots.forEach(d=>d.el.classList.remove('outlier','core-dot','placed'));const{w,h}=arenaSize(),cx=w/2,cy=h/2;for(const d of dots){d.el.style.transition='none';const dx=d.x-cx,dy=d.y-cy,l=Math.hypot(dx,dy)||1,b=.14+Math.random()*.13;d.vx=dx/l*b+(Math.random()-.5)*.08;d.vy=dy/l*b+(Math.random()-.5)*.08}arena.classList.remove('fail','success');busy=false;renderDock();setStatus('TRY AGAIN!','つぎの BREAK CARD を えらぼう')}
function candidateValues(){if(isPrime(currentNumber)){const nums=shuffle(primePool.filter(p=>p!==currentNumber).slice()).slice(0,4);return nums.map(value=>({value,prime:false})).concat({value:'PRIME',prime:true})}const valid=primeDivisors(currentNumber),chosen=[];if(valid.length)chosen.push(valid[Math.floor(Math.random()*valid.length)]);if(valid.length>1&&Math.random()<.45){const v=valid.find(x=>x!==chosen[0]);if(v)chosen.push(v)}const rest=shuffle(primePool.filter(p=>!chosen.includes(p)).slice());while(chosen.length<4&&rest.length)chosen.push(rest.shift());return shuffle(chosen.slice(0,4)).map(value=>({value,prime:false})).concat({value:'PRIME',prime:true})}
function miniDots(n){return Array.from({length:Math.min(13,n)},()=>'<i class="mini-dot"></i>').join('')}function renderDock(){dock.innerHTML='';for(const item of candidateValues()){const c=document.createElement('div');c.className='factor-card'+(item.prime?' prime':'');c.dataset.value=item.value;c.dataset.prime=item.prime?'1':'0';c.innerHTML=item.prime?'<small>FINAL</small><div class="factor-value">PRIME</div>':`<small>BREAK</small><div class="mini-dots">${miniDots(item.value)}</div><div class="factor-value">${item.value}</div>`;c.addEventListener('pointerdown',startDrag);dock.appendChild(c)}}
function updateHud(){$('#stage').textContent=stage;$('#score').textContent=score;$('#miss').textContent='MISS '+misses;$('#coreNumber').textContent=currentNumber}
async function mergeSuccess(factor,pts){setStatus('CORE BREAK!',`${factor}こずつ CORE に へんかん`,'gold');enemyReact('hit');breakShield();screenFlash('good');const rows=currentNumber/factor;for(let r=0;r<rows;r++){const coreIndex=r*factor,core=dots[coreIndex],tx=pts[coreIndex][0],ty=pts[coreIndex][1];core.el.classList.add('core-dot');for(let c=1;c<factor;c++){const d=dots[coreIndex+c];d.el.style.opacity='.05';d.el.style.transform=`translate3d(${tx}px,${ty}px,0) scale(.08)`}}await sleep(1000);factors.push(factor);score+=20;currentNumber/=factor;updateHud();createDots(currentNumber);renderDock();arena.classList.remove('success');busy=false;if(isPrime(currentNumber))setStatus('PRIME CORE?',`CORE ${currentNumber} を みきわめろ`,'gold');else setStatus('NEXT CORE!',`CORE ${currentNumber} を BREAK しよう`)}
async function tryFactor(factor){if(busy||complete)return;busy=true;dock.innerHTML='';const pts=await arrangeSequential(factor),rem=currentNumber%factor;if(rem===0){arena.classList.add('success');setStatus('SYNC!','PERFECT FORM!','good',true);screenFlash('good');await waitAdvance(4500);await mergeSuccess(factor,pts);return}const missing=factor-rem;score=Math.max(0,score-10);misses++;stageMisses++;updateHud();arena.classList.add('fail');screenFlash('bad');enemyReact('attack');if(rem<=missing){for(let i=currentNumber-rem;i<currentNumber;i++)dots[i].el.classList.add('outlier');setStatus(`${rem} DOT${rem===1?'':'S'} OUT!`,`${rem}こ はみだした！`,'bad',true)}else{showMissing(factor);setStatus(`あと ${missing}こ!`,'SYNC に とどかなかった！','bad',true)}await waitAdvance(4800);scatter()}
async function tryPrime(){if(busy||complete)return;if(!isPrime(currentNumber)){score=Math.max(0,score-15);misses++;stageMisses++;updateHud();arena.classList.add('fail');enemyReact('attack');screenFlash('bad');setStatus('CORE LOCKED!','まだ SYNC できる！','bad',true);busy=true;dock.innerHTML='';await waitAdvance(4300);arena.classList.remove('fail');busy=false;renderDock();setStatus('TRY AGAIN!','BREAK CARD を えらぼう');return}busy=true;dock.innerHTML='';setStatus('PRIME CORE!','FINAL BREAK の じゅんび','gold');const pts=circlePositions();dots.forEach((d,i)=>setDot(d,pts[i][0],pts[i][1],true));dots.forEach((d,i)=>setTimeout(()=>d.el.animate([{filter:'brightness(1)'},{filter:'brightness(2.4)'},{filter:'brightness(1)'}],{duration:650}),i*18));await sleep(1100);setStatus('PRIME CORE EXPOSED!','タップで FINAL BREAK','gold',true);await waitAdvance(5000);await destroyEnemy()}
function burstParticles(){const r=enemy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<28;i++){const p=document.createElement('i');p.className='particle';const a=Math.random()*6.28,dist=70+Math.random()*150;p.style.left=cx+'px';p.style.top=cy+'px';p.style.color=dotColor(i,28);p.style.background='currentColor';document.body.appendChild(p);p.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px) scale(${.6+Math.random()})`,opacity:0}],{duration:700+Math.random()*600,easing:'cubic-bezier(.2,.8,.2,1)'});setTimeout(()=>p.remove(),1400)}}
async function destroyEnemy(){complete=true;score+=30;if(stageMisses===0)score+=50;updateHud();setStatus('FINAL BREAK!','CORE を はかい！','gold');screenFlash('good');burstParticles();enemy.classList.add('defeated');document.querySelectorAll('.shield').forEach(s=>s.classList.add('break'));await sleep(950);const all=[...factors,currentNumber];$('#coreCode').textContent=`${initialNumber} = ${all.join(' × ')}`;$('#resultLayer').classList.add('show')}
function startStage(){initialNumber=makeStageNumber();currentNumber=initialNumber;factors=[];stageMisses=0;complete=false;busy=false;pickEnemy();resetShields();$('#resultLayer').classList.remove('show');arena.classList.remove('fail','success','dropready');updateHud();createDots();renderDock();setStatus('ENEMY CORE DETECTED!',`CORE ${currentNumber} を BREAK しよう`)}$('#nextEnemy').onclick=()=>{stage++;startStage()};
function startDrag(e){if(busy||complete)return;e.preventDefault();const card=e.currentTarget,prime=card.dataset.prime==='1',value=card.dataset.value,ghost=document.createElement('div');ghost.className='drag-ghost'+(prime?' prime':'');ghost.textContent=prime?'PRIME':value;document.body.appendChild(ghost);card.classList.add('dragging');drag={card,ghost,prime,value,pointerId:e.pointerId};moveDrag(e);window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag,{once:true})}
function moveDrag(e){if(!drag)return;drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';const r=arena.getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;arena.classList.toggle('dropready',inside)}function endDrag(e){if(!drag)return;window.removeEventListener('pointermove',moveDrag);const r=arena.getBoundingClientRect(),inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;drag.card.classList.remove('dragging');drag.ghost.remove();arena.classList.remove('dropready');const d=drag;drag=null;if(!inside)return;if(d.prime)tryPrime();else tryFactor(Number(d.value))}
function resizeDots(){if(!dots.length||busy)return;const s=arenaSize();for(const d of dots){d.x=Math.min(d.x,s.w-20);d.y=Math.min(d.y,s.h-20);setDot(d,d.x,d.y,false)}}window.addEventListener('resize',resizeDots);
startStage();cancelAnimationFrame(animId);animId=requestAnimationFrame(animate);
</script>
</body>
