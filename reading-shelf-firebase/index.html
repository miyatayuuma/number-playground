<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8EF">
<meta name="application-name" content="よんでね">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="よんでね">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="description" content="家族の読書記録を安全に共有する本棚">
<title>よんでね | あおのほんだな</title>
<link rel="stylesheet" href="./style.css">
</head><body>
<header><div class="top">
  <div class="logo"><img class="logoIcon" alt="" src="./icon.svg"><div>よんでね<small>あおのほんだな</small></div></div>
  <div class="headerActions"><button id="installApp" class="installApp" hidden>アプリを追加</button><button id="familySettings" class="iconButton" hidden aria-label="家族の設定" title="家族の設定">⚙</button><span id="identity" aria-live="polite"></span><button id="signOut" hidden>ログアウト</button></div>
</div></header>
<main>
  <section class="hero"><h1 id="shelfName">あおのほんだな</h1><p>家族で見る、読書の記録。</p></section>
  <div id="message" role="alert" class="notice" hidden></div>
  <section id="loading" class="panel center"><p>データを確認しています…</p></section>
  <section id="loginPanel" class="panel center" hidden><h2>Googleアカウントでログイン</h2><p>一度ログインすると、同じ端末では原則として次回から自動で接続します。</p><button class="primary" id="googleLogin">Googleでログイン</button><p class="muted tiny">このURLを知っているだけでは読書記録は見られません。</p></section>
  <section id="setupPanel" class="panel" hidden><h2 id="setupTitle">家族の本棚へ参加</h2><p id="setupDesc">管理者から受け取った招待URLでログインしてください。</p><div id="setupBody"></div></section>
  <section id="shelfPanel" hidden>
    <div class="stats"><div><strong id="readCount">0</strong><span>読んだ本</span></div><div><strong id="totalCount">0</strong><span>登録した本</span></div><div><strong id="seriesCount">0</strong><span>シリーズ</span></div></div>
    <nav class="tabs" aria-label="表示切替">
      <button data-view="shelf" class="active">本棚</button><button data-view="series">シリーズ</button><button data-view="recommendations">おすすめ</button>
    </nav>
    <div id="bookControls" class="controls">
      <input id="search" type="search" placeholder="本や作者をさがす" aria-label="本や作者を検索">
      <select id="filter" aria-label="読書状況">
        <option value="read">読んだ</option><option value="all">すべて</option>
        <option value="reading">読んでいる</option><option value="paused">お休み中</option><option value="unread">まだ読んでいない</option>
      </select>
      <select id="sort" aria-label="並び方">
        <option value="order">読んだ順</option><option value="title">タイトル</option>
        <option value="author">作者</option><option value="year">出版年</option>
      </select>
      <button id="sortDirection" aria-label="並び順を反転" title="並び順を反転">新しい順 ↓</button>
      <button id="timelineToggle" aria-pressed="false">時期別に見る</button>
    </div>
    <div id="content" aria-live="polite"></div>
  </section>
</main>
<dialog id="bookInfoDialog">
  <div class="dialogInner">
    <div class="dialogTop"><h2 id="bookInfoTitle">本の詳細</h2><button type="button" class="ghost" data-close="bookInfoDialog" aria-label="閉じる">×</button></div>
    <div id="bookInfoBody"></div>
  </div>
</dialog>
<script type="module" src="./app.mjs?build=20261016-family-detail-v5"></script>
</body></html>
