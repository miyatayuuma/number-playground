name: Reading Shelf Firebase CI
on:
  push:
    branches: [feature/reading-shelf-family-firebase]
    paths:
      - 'reading-shelf-firebase/**'
      - '.github/workflows/reading-shelf-family.yml'
  pull_request:
    paths:
      - 'reading-shelf-firebase/**'
      - '.github/workflows/reading-shelf-family.yml'
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure domain behavior
        run: node --test reading-shelf-firebase/domain.test.mjs reading-shelf-firebase/pwa.test.mjs reading-shelf-firebase/book-lookup.test.mjs
      - name: Browser module syntax
        run: |
          node --check reading-shelf-firebase/app.mjs
          node --check reading-shelf-firebase/book-community.mjs
          node --check reading-shelf-firebase/recommendations.mjs
          node --check reading-shelf-firebase/book-lookup.mjs
          node --check reading-shelf-firebase/activity.mjs
          node --check reading-shelf-firebase/owner-reflection.mjs
          node --check reading-shelf-firebase/speech-dictation.mjs
          node --check reading-shelf-firebase/sw.js
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-audit --no-fund
        working-directory: reading-shelf-firebase
      - name: Family authorization emulator tests
        working-directory: reading-shelf-firebase
        run: npx firebase emulators:exec --only firestore --project demo-reading-shelf-rules "node --test firestore.rules.test.mjs"
